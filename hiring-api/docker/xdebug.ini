; Configuração do Xdebug para debugging com o VSCode.
; O VSCode escuta na porta 9003 (perfil "Listen for Xdebug" do launch.json).
; host.docker.internal é resolvido pelo extra_hosts do docker-compose (host-gateway),
; permitindo que o PHP dentro do container alcance o listener do VSCode na máquina host.
;
; As variáveis de ambiente abaixo podem ser sobrescritas no .env do projeto
; (ex.: XDEBUG_MODE=off para desativar sem rebuild da imagem).

; Modo: apenas step-debugging (cobertura fica com o pcov, já instalado).
xdebug.mode=${XDEBUG_MODE:-debug}

; "yes" = toda requisição tenta conectar no debugger (basta dar F5 no VSCode).
; "trigger" = só conecta quando a requisição tem XDEBUG_SESSION (cookie/query).
xdebug.start_with_request=${XDEBUG_START_WITH_REQUEST:-yes}

; Cliente = host (VSCode escutando na porta 9003).
; ATENÇÃO (Docker Desktop for Linux): host.docker.internal NÃO funciona como
; client_host neste ambiente — use o IP real da interface do host no .env:
;   XDEBUG_CLIENT_HOST=<IP do host>
; Para descobrir: `ip -brief addr show` no host (ex.: 192.168.250.164).
xdebug.client_host=${XDEBUG_CLIENT_HOST:-host.docker.internal}
xdebug.client_port=9003

; Timeout curto de conexão para não atrasar requisições quando o VSCode não está escutando.
xdebug.connect_timeout_ms=200

; Log de diagnóstico (descomente para investigar problemas de conexão):
; xdebug.log=/tmp/xdebug.log
; xdebug.log_level=7
